name: Windows quality gate

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release
      - name: Build and inspect NSIS installer
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          New-Item -ItemType Directory -Force dist | Out-Null
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" install.nsi
          $installer = 'dist\SyphonNov-0.5.2-Setup.exe'
          if (!(Test-Path $installer)) { throw "Installer missing: $installer" }
          if ((Get-Item $installer).Length -lt 1MB) { throw 'Installer is unexpectedly small' }
